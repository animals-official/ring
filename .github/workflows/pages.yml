name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/generate-rings.mjs
      - name: Stage the static site
        run: |
          mkdir _site
          cp index.html style.css app.js image.js ring.js rings.json _site/
          cp -R assets rings _site/
          sed -i "s|\./style\.css|./style.css?v=${GITHUB_SHA}|; s|\./app\.js|./app.js?v=${GITHUB_SHA}|" _site/index.html
          sed -i "s|\./image\.js|./image.js?v=${GITHUB_SHA}|; s|\./ring\.js|./ring.js?v=${GITHUB_SHA}|" _site/app.js
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
